on:
  push:
    - workflows: [publish-development-release]
      filter:
        branches: [dev]
    - workflows: [publish-stable-release]
      filter:
        branches: [release]

workflows:
  publish-development-release:
    tasks: [build-and-publish]
  publish-stable-release:
    tasks: [build-and-publish]

tasks:
  - name: build-and-publish
    cubes:
      - name: build-and-publish-sourcecraft-release
        env:
          SOURCECRAFT_TOKEN: ${{ secrets.SOURCECRAFT_TOKEN }}
        image:
          name: mcr.microsoft.com/dotnet/sdk:10.0
          entrypoint: ""
        script:
          - |
            set -euo pipefail

            branch="${SOURCECRAFT_COMMIT_REF_NAME:?SourceCraft branch name is missing}"
            repo_url="${SOURCECRAFT_REPO_URL:?SourceCraft repository URL is missing}"
            repo_path="$(printf '%s' "$repo_url" | sed -E 's#^.*git\.sourcecraft\.dev[:/]##; s#\.git$##')"
            if [[ ! "$repo_path" =~ ^[^/]+/[^/]+$ ]]; then
              echo "Cannot determine SourceCraft organization/repository from: $repo_url" >&2
              exit 1
            fi
            org_slug="${repo_path%%/*}"
            repo_slug="${repo_path#*/}"

            case "$branch" in
              dev)
                prerelease=true
                ;;
              release)
                prerelease=false
                ;;
              *)
                echo "Unsupported release branch: $branch" >&2
                exit 1
                ;;
            esac

            base_version="$(dotnet msbuild DS3231/DS3231.csproj -getProperty:Version -nologo)"
            if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Expected a stable x.y.z version in DS3231.csproj, got: $base_version" >&2
              exit 1
            fi

            if [[ "$prerelease" == true ]]; then
              commit_suffix="${SOURCECRAFT_COMMIT_SHA:?SourceCraft commit SHA is missing}"
              package_version="${base_version}-dev.$(date -u +%Y%m%d%H%M%S).${commit_suffix:0:8}"
            else
              package_version="$base_version"
            fi
            release_tag="v${package_version}"

            apt-get update -qq
            apt-get install -y --no-install-recommends ca-certificates curl jq

            dotnet build DS3231/DS3231.csproj --configuration Release
            dotnet pack DS3231/DS3231.csproj --configuration Release --no-build --output artifacts "-p:PackageVersion=${package_version}"

            package_name="West.RTC.DS3231.${package_version}.nupkg"
            package_path="artifacts/${package_name}"
            if [[ ! -s "$package_path" ]]; then
              echo "Expected package was not created: $package_path" >&2
              exit 1
            fi

            api_url="https://api.sourcecraft.tech/repos/${org_slug}/${repo_slug}/releases"
            api_headers=(-H "Authorization: Bearer ${SOURCECRAFT_TOKEN}")
            response_file="$(mktemp)"
            status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' "${api_url}/tag/${release_tag}" "${api_headers[@]}")"
            case "$status" in
              404)
                ;;
              200)
                echo "SourceCraft Release ${release_tag} already exists; refusing to overwrite it." >&2
                exit 1
                ;;
              *)
                cat "$response_file" >&2
                echo "Failed to check SourceCraft Release (HTTP ${status})." >&2
                exit 1
                ;;
            esac

            tags_response="$(mktemp)"
            curl --fail-with-body --silent --show-error --get "${api_url%/releases}/tags" \
              "${api_headers[@]}" \
              --data-urlencode "filter=${release_tag}" \
              --data-urlencode "page_size=100" \
              --output "$tags_response"
            if jq -e --arg tag "$release_tag" '.tags[]? | select(.name == $tag)' "$tags_response" >/dev/null; then
              release_payload="$(jq -n \
                --arg tag "$release_tag" \
                --arg title "$release_tag" \
                --arg notes "${package_version} built from the ${branch} branch by SourceCraft." \
                '{tag: $tag, title: $title, release_notes: $notes, publish: false}')"
            else
              release_payload="$(jq -n \
                --arg tag "$release_tag" \
                --arg branch "$branch" \
                --arg title "$release_tag" \
                --arg notes "${package_version} built from the ${branch} branch by SourceCraft." \
                '{tag: $tag, target_branch: $branch, title: $title, release_notes: $notes, publish: false}')"
            fi

            curl --fail-with-body --silent --show-error \
              -X POST "${api_url}" "${api_headers[@]}" \
              -H "Content-Type: application/json" \
              --data "$release_payload" \
              --output "$response_file"
            jq -e --arg tag "$release_tag" '.tag == $tag and .status == "draft"' "$response_file" >/dev/null

            upload_response="$(mktemp)"
            curl --fail-with-body --silent --show-error \
              -X POST "${api_url}/tag/${release_tag}/attachments" \
              "${api_headers[@]}" \
              -F "name=${package_name}" \
              -F "file=@${package_path};type=application/octet-stream" \
              --output "$upload_response"
            jq -e --arg name "$package_name" '.name == $name' "$upload_response" >/dev/null

            curl --fail-with-body --silent --show-error \
              -X POST "${api_url}/tag/${release_tag}/publish" \
              "${api_headers[@]}" \
              --output "$response_file"
            jq -e --argjson prerelease "$prerelease" '.status == "published" and .is_pre_release == $prerelease' "$response_file" >/dev/null

            echo "Published SourceCraft $(if [[ "$prerelease" == true ]]; then echo 'Pre-release'; else echo 'Release'; fi) ${release_tag} with ${package_name}. No GitHub Release or NuGet push is performed."
