name: Publish NuGet package

on:
  push:
    branches:
      - dev
      - release

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack package
        id: pack
        shell: bash
        run: |
          version="$(dotnet msbuild DS3231/DS3231.csproj -getProperty:Version -nologo)"
          if [[ "$GITHUB_REF_NAME" == "dev" ]]; then
            version="${version}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          dotnet pack DS3231/DS3231.csproj --configuration Release --output artifacts "-p:PackageVersion=$version"

      - name: Create GitHub Release and attach package
        if: github.ref_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pack.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.pack.outputs.version }}
          generate_release_notes: true
          files: artifacts/*.nupkg
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get temporary NuGet API key (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package to NuGet.org
        shell: bash
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
